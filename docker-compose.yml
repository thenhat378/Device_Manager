version: '3.8'

services:
  app:
    build: .
    container_name: due-equipment-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: always

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-local
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
    restart: always

volumes:
  n8n_data:
